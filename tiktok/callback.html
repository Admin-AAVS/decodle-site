<!DOCTYPE html>
<html>
<head><title>DEcoDLE — TikTok Auth</title>
<style>
  body { background: #0a0a0a; color: #00ff88; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { text-align: center; max-width: 500px; padding: 2rem; }
  code { background: #1a1a1a; padding: 8px 16px; border-radius: 4px; display: block; margin: 1rem 0; word-break: break-all; font-size: 14px; color: #fff; }
  h2 { color: #00ff88; }
</style>
</head>
<body>
<div class="box">
  <h2>:/System> Auth callback received.</h2>
  <p>Copy this code and paste it to CC:</p>
  <code id="code">Loading...</code>
  <p style="color:#666">You can close this tab after copying.</p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const el = document.getElementById('code');
  if (code) {
    el.textContent = code;
  } else {
    el.textContent = 'Error: ' + (params.get('error') || 'no code received');
    el.style.color = '#ff4444';
  }
</script>
</body>
</html>
