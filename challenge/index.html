<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEcoDLE — Challenge</title>
<meta name="description" content="Someone challenged you to crack their DEcoDLE cypher. Can you decode it?">
<meta property="og:title" content="DEcoDLE — You've Been Challenged">
<meta property="og:description" content="Someone encrypted a 5-symbol sequence just for you. Crack the Cypher. Decode the sequence.">
<meta property="og:image" content="/og-image.png">
<meta name="theme-color" content="#0D0B07">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --phosphor: #00FF41;
  --phosphor-dim: #003300;
  --phosphor-glow: rgba(0,255,65,0.4);
  --tile-warm: #F5ECD7;
  --ink: #0D0B07;
}
body {
  background: var(--ink);
  color: var(--tile-warm);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
}
.logo {
  font-size: clamp(2rem, 8vw, 3.5rem);
  font-weight: 900;
  letter-spacing: 0.05em;
  margin-bottom: 0.5rem;
  -webkit-text-stroke: 5px #000;
}
.logo .d1 { color: #2ECC10; }
.logo .e1 { color: #A8E000; }
.logo .c  { color: #FF8C00; text-transform: lowercase; font-size: 0.7em; -webkit-text-stroke: 4px #000; position: relative; top: 0.15em; }
.logo .o  { color: #FF4FCB; font-size: 0.7em; -webkit-text-stroke: 4px #000; position: relative; top: 0.15em; }
.logo .mid-d {
  color: #2ECC10;
  cursor: pointer;
  user-select: none;
  animation: mid-d-flicker 4.5s ease-in-out infinite;
}
.logo .l  { color: #4169E1; }
.logo .e2 { color: #00CED1; }
@keyframes mid-d-flicker {
  0%, 88%  { color: #2ECC10; -webkit-text-stroke: 5px #000; text-shadow: none; }
  89%      { color: #39FF14; -webkit-text-stroke: 5px #003300; text-shadow: 0 0 12px #39FF14, 0 0 30px rgba(57,255,20,0.8); }
  89.5%    { color: #2ECC10; -webkit-text-stroke: 5px #000; text-shadow: none; }
  90.5%    { color: #00FF41; -webkit-text-stroke: 5px #001a00; text-shadow: 0 0 20px #00FF41, 0 0 50px rgba(0,255,65,0.6); }
  91.5%    { color: #2ECC10; -webkit-text-stroke: 5px #000; text-shadow: none; }
  100%     { color: #2ECC10; -webkit-text-stroke: 5px #000; text-shadow: none; }
}
.logo.matrix-active span {
  color: #00FF41 !important;
  -webkit-text-stroke: 9px #001a00 !important;
  animation: matrix-pulse 2s ease-in-out infinite !important;
  text-shadow: none;
}
.logo.matrix-active .c,
.logo.matrix-active .o { -webkit-text-stroke: 7px #001a00 !important; }
@keyframes matrix-pulse {
  0%, 100% { color: #00FF41; text-shadow: 0 0 8px #00FF41, 0 0 24px rgba(0,255,65,0.7), 0 0 60px rgba(0,255,65,0.3); }
  50%       { color: #39FF85; text-shadow: 0 0 4px #39FF85, 0 0 14px rgba(57,255,133,0.5), 0 0 35px rgba(57,255,133,0.2); }
}
.challenge-code {
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  color: var(--phosphor);
  margin: 1.5rem 0 0.5rem;
  text-shadow: 0 0 20px var(--phosphor-glow);
  letter-spacing: 0.15em;
}
.tagline {
  color: rgba(245,236,215,0.6);
  font-size: 0.95rem;
  margin-bottom: 2rem;
  max-width: 360px;
  line-height: 1.5;
}
.status {
  color: var(--phosphor);
  font-size: 0.85rem;
  margin-bottom: 2rem;
  opacity: 0.7;
}
.store-btns {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
}
.store-btn {
  display: inline-block;
  padding: 0.75rem 1.5rem;
  border: 1.5px solid rgba(0,255,65,0.4);
  border-radius: 10px;
  color: var(--phosphor);
  text-decoration: none;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  transition: all 0.2s;
  background: rgba(0,255,65,0.06);
}
.store-btn:hover {
  border-color: var(--phosphor);
  background: rgba(0,255,65,0.12);
  box-shadow: 0 0 20px rgba(0,255,65,0.25);
}
.footer-note {
  margin-top: 3rem;
  font-size: 0.7rem;
  color: rgba(245,236,215,0.25);
}
</style>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var isAndroid = /Android/i.test(navigator.userAgent);

  // iOS: Universal Links handle the handoff natively — no JS redirect needed.
  // Android: try custom scheme, fall back to Play Store.
  if (code && isAndroid) {
    var deepLink = 'decodle://challenge?code=' + encodeURIComponent(code);
    window.location.href = deepLink;

    setTimeout(function () {
      if (!document.hidden) {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.kallogic.decodle';
      }
    }, 1500);
  }
})();
</script>
</head>
<body>

<div class="logo" id="challenge-logo">
  <span class="d1">D</span><span class="e1">E</span><span class="c">c</span><span class="o">o</span><span class="mid-d" id="challenge-mid-d">D</span><span class="l">L</span><span class="e2">E</span>
</div>

<div class="challenge-code" id="code-display">:/System> CHALLENGE INCOMING</div>

<p class="tagline">Someone encrypted a 5-symbol sequence just for you. Download DEcoDLE, enter the code, and try to crack it.</p>

<p class="status" id="status">Attempting to open DEcoDLE...</p>

<div class="store-btns">
  <a class="store-btn" href="https://apps.apple.com/app/decodle/id6762175972">App Store</a>
  <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.kallogic.decodle">Google Play</a>
</div>

<p class="footer-note">decodle.app &mdash; Ad Astra Vanguard Studios LLC</p>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var codeEl = document.getElementById('code-display');
  var statusEl = document.getElementById('status');

  if (code) {
    var display = code.toUpperCase();
    if (display.length >= 5 && display.indexOf('-') === -1) {
      display = display.slice(0, 2) + '-' + display.slice(2);
    }
    codeEl.textContent = '> CODE: ' + display;
    statusEl.textContent = 'If the app didn\'t open, download it and enter the code above.';
  } else {
    codeEl.textContent = ':/System> NO CODE DETECTED';
    statusEl.textContent = 'This link is missing a challenge code.';
  }
})();
</script>

<script>
(function () {
  var midD = document.getElementById('challenge-mid-d');
  var logo = document.getElementById('challenge-logo');
  var matrixTimer = null;
  midD.addEventListener('click', function () {
    logo.classList.add('matrix-active');
    clearTimeout(matrixTimer);
    matrixTimer = setTimeout(function () {
      logo.classList.remove('matrix-active');
    }, 5000);
  });
})();
</script>

</body>
</html>
